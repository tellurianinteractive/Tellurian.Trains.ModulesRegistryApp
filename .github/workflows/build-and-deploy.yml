name: Build and deploy

# Every push and pull request: build and test.
# Push to master: also deploy to Azure, but only when <Version> in Directory.Build.props has no matching tag v<Version> yet.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even if the version is already tagged
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel outdated runs; runs on master are never cancelled, so a deploy is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.version.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # Projects are built one by one: the .slnx also contains Database.sqlproj, which dotnet can't build.
      - name: Build
        run: |
          dotnet build "SourceCode/App/App.csproj" --configuration Release
          dotnet build "TestCode/App.Tests/App.Tests.csproj" --configuration Release
          dotnet build "TestCode/Data.Tests/Data.Tests.csproj" --configuration Release
          dotnet build "TestCode/Services.Tests/Services.Tests.csproj" --configuration Release

      - name: Test App
        run: dotnet test --project "TestCode/App.Tests/App.Tests.csproj" --configuration Release --no-build

      - name: Test Data
        run: dotnet test --project "TestCode/Data.Tests/Data.Tests.csproj" --configuration Release --no-build

      - name: Test Services
        run: dotnet test --project "TestCode/Services.Tests/Services.Tests.csproj" --configuration Release --no-build

      - name: Decide whether to deploy
        id: version
        env:
          FORCE: ${{ inputs.force }}
          IS_MASTER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1 | tr -d '[:space:]')
          if [ -z "$version" ]; then echo "::error::No <Version> found in Directory.Build.props"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$IS_MASTER" != "true" ]; then
            echo "Not master, nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Version $version is new and will be deployed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            echo "Version $version is already tagged, redeploying because force is set."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is already tagged, nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # Every release has a section with its date and at least one bullet in RELEASENOTES.md
      # (changes that affect users or security, otherwise "- Maintenance update.").
      - name: Check release notes
        if: steps.version.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tr -d '\r' < RELEASENOTES.md | awk -v heading="## Release $VERSION" '
            found == 2 { if ($0 ~ /^- /) ok = 1; exit }
            found == 1 { if ($0 ~ /^Released [0-9]{4}-[0-9]{2}-[0-9]{2}$/) found = 2; else exit; next }
            $0 == heading { found = 1 }
            END { exit ok ? 0 : 1 }
          ' || { echo "::error::RELEASENOTES.md needs a section '## Release $VERSION', then 'Released yyyy-MM-dd', then at least one bullet (e.g. '- Maintenance update.')."; exit 1; }

      - name: Publish
        if: steps.version.outputs.deploy == 'true'
        run: dotnet publish "SourceCode/App/App.csproj" --configuration Release --output publish

      # The Terms of Use date decides whether users must accept the terms again; it must come from the file content.
      - name: Check Terms of Use date
        if: steps.version.outputs.deploy == 'true'
        run: |
          head -n 1 publish/Content/Markdown/TermsOfUse.md | grep -q '<!-- LastModified: ' \
            || { echo "::error::TermsOfUse.md has no LastModified line; deploying would move its date."; exit 1; }

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.deploy == 'true'
        with:
          name: app
          path: publish
          retention-days: 30

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://moduleregistry.azurewebsites.net
    permissions:
      contents: write # Tag and GitHub release.
      id-token: write # OIDC login to Azure.
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7 # For RELEASENOTES.md.

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: publish

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ModuleRegistry
          package: publish

      # Kudu can report "Deployment successful" without copying any files (it happened when its deployment
      # script crashed), so compare the deployed main assembly with the one in the build output.
      - name: Verify deployed files
        run: |
          token=$(az account get-access-token --resource https://management.core.windows.net/ --query accessToken --output tsv)
          expected=$(sha256sum publish/ModulesRegistry.dll | cut -d ' ' -f 1)
          for attempt in 1 2 3 4 5 6; do
            curl --silent --show-error --fail --header "Authorization: Bearer $token" \
              --output deployed.dll "https://moduleregistry.scm.azurewebsites.net/api/vfs/site/wwwroot/ModulesRegistry.dll" || true
            actual=$( [ -f deployed.dll ] && sha256sum deployed.dll | cut -d ' ' -f 1 )
            if [ "$actual" = "$expected" ]; then echo "Deployed ModulesRegistry.dll matches the build output."; exit 0; fi
            echo "Attempt $attempt: deployed ModulesRegistry.dll doesn't match yet, waiting..."
            sleep 10
          done
          echo "::error::The deployed ModulesRegistry.dll differs from the build output: the files were not deployed."
          exit 1

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bullets of this version's release notes section.
          awk -v heading="## Release $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !/^Released / { print }
          ' <(tr -d '\r' < RELEASENOTES.md) > release-notes.md
          if [ ! -s release-notes.md ]; then echo "- Maintenance update." > release-notes.md; fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists (forced redeploy)."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Release $VERSION" --notes-file release-notes.md
          fi