name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Projects are built one by one: the .slnx also contains Database.sqlproj, which dotnet can't build.
      - name: Build
        run: |
          dotnet build "SourceCode/App/App.csproj" --configuration Release
          dotnet build "TestCode/Data.Tests/Data.Tests.csproj" --configuration Release
          dotnet build "TestCode/Services.Tests/Services.Tests.csproj" --configuration Release

      - name: Test Data
        run: dotnet test --project "TestCode/Data.Tests/Data.Tests.csproj" --configuration Release --no-build

      - name: Test Services
        run: dotnet test --project "TestCode/Services.Tests/Services.Tests.csproj" --configuration Release --no-build